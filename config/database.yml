default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DATABASE_PORT") { 5432 } %>
  username: <%= ENV.fetch("DATABASE_USER") { "postgres" } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { "" } %>

development:
  <<: *default
  database: todo_api_development

test:
  <<: *default
  database: todo_api_test

production:
  primary: &primary_production
    <<: *default
    database: todo_api_production
    username: todo_api
    password: <%= ENV["TODO_API_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: todo_api_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: todo_api_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: todo_api_production_cable
    migrations_paths: db/cable_migrate
